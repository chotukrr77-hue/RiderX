name: Build Premium RiderX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Pro App Files
      run: |
        mkdir -p app/src/main/java/com/riderx/app
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

        # 1. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "RiderX"
        include(":app")
        EOF

        # 2. Root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # 3. App build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
        android {
            namespace = "com.riderx.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.riderx.app"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
        }
        dependencies {
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2024.02.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="RiderX Pro" android:theme="@android:style/Theme.Material.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.kt (Premium Dark UI)
        cat << 'EOF' > app/src/main/java/com/riderx/app/MainActivity.kt
        package com.riderx.app
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.*
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    Scaffold(containerColor = Color(0xFF0B0F0C)) { padding ->
                        Column(modifier = Modifier.padding(padding).padding(16.dp).fillMaxSize()) {
                            Text("RiderX Pro", color = Color(0xFFB7F34A), fontSize = 32.sp, fontWeight = FontWeight.ExtraBold)
                            Text("Ride Together. Explore More.", color = Color.Gray, fontSize = 14.sp)
                            Spacer(modifier = Modifier.height(24.dp))
                            
                            Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF141A16)), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                                Column(modifier = Modifier.padding(20.dp)) {
                                    Text("Total Distance", color = Color.Gray, fontSize = 12.sp)
                                    Text("1,248 KM", color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                                    Spacer(modifier = Modifier.height(16.dp))
                                    Button(onClick = {}, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFB7F34A)), modifier = Modifier.fillMaxWidth()) {
                                        Text("Start Professional Ride", color = Color.Black, fontWeight = FontWeight.Bold)
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
        EOF

    - name: Build APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RiderX-Pro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
